<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empresas — Royal Hub</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="theme-color" content="#0C0B09">
<link rel="icon" href="/icones/icone-192.png">
<link rel="stylesheet" href="/styles.css">
<style>
.tela{min-height:100vh;padding:28px 20px 60px}
.dentro{max-width:1000px;margin:0 auto}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.marca b{font-family:var(--f-disp);font-size:24px;letter-spacing:.18em;color:var(--gold-soft);display:block;font-weight:400}
.marca span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted2)}
.entrada{min-height:100vh;display:grid;place-items:center;padding:24px}
.caixa{width:100%;max-width:390px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
.campo input{width:100%}
.btn.w{width:100%;justify-content:center;padding:12px}
.aviso{padding:11px 13px;border-radius:var(--r);font-size:13px;margin-bottom:14px;line-height:1.5}
.aviso.erro{background:rgba(190,70,60,.12);border:1px solid rgba(190,70,60,.4);color:#E8A79F}
.aviso.ok{background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.35);color:var(--gold-soft)}
.codigo{font-family:var(--f-mono);font-size:22px;letter-spacing:.18em;color:var(--gold-soft)}
table.tab td{vertical-align:middle}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:720px){.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="raiz"></div>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = id => (document.getElementById(id)||{}).value || "";
let estado = {}, empresas = [], backups = [], aviso = null;

async function api(rota, opcoes){
  const r = await fetch("/api/dono"+rota, {headers:{"content-type":"application/json"}, ...opcoes});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.erro || ("Erro "+r.status));
  return j;
}

const campo = (id, rotulo, tipo="text", extra="") =>
  `<div class="campo"><label for="${id}">${rotulo}</label><input id="${id}" type="${tipo}" ${extra}></div>`;

const mostrarAviso = () => aviso ? `<div class="aviso ${aviso.tipo}">${esc(aviso.texto)}</div>` : "";

/* ---------------- entrada ---------------- */
function telaEntrada(){
  const primeiro = estado.primeiroAcesso;
  document.getElementById("raiz").innerHTML = `
  <main class="entrada"><div class="caixa">
    <div class="marca" style="text-align:center;margin-bottom:28px">
      <b>ROYAL</b><span>Painel do dono</span></div>
    <div class="card">
      <h3 style="margin-top:0">${primeiro ? "Criar a conta de dono" : "Entrar"}</h3>
      <p class="muted" style="margin-top:0">${primeiro
        ? "Esta é a sua conta, separada das empresas. É com ela que você cadastra quem vai usar o sistema."
        : "Área reservada. As empresas não enxergam esta tela."}</p>
      ${mostrarAviso()}
      ${primeiro ? campo("nome","Seu nome","text",'autofocus') : ""}
      ${campo("email","E-mail","email", primeiro?"":"autofocus")}
      ${campo("senha","Senha","password")}
      <button class="btn primary w" onclick="${primeiro?"criarDono()":"entrar()"}">
        ${primeiro ? "Criar conta e entrar" : "Entrar"}</button>
    </div>
  </div></main>`;
  document.querySelectorAll("#raiz input").forEach(i =>
    i.addEventListener("keydown", e => { if(e.key==="Enter") (primeiro?criarDono:entrar)(); }));
}

async function entrar(){
  try{ await api("/entrar",{method:"POST",body:JSON.stringify({email:val("email"),senha:val("senha")})}); comecar(); }
  catch(e){ aviso={tipo:"erro",texto:e.message}; telaEntrada(); }
}

async function criarDono(){
  try{ await api("/primeiro-acesso",{method:"POST",body:JSON.stringify({nome:val("nome"),email:val("email"),senha:val("senha")})}); comecar(); }
  catch(e){ aviso={tipo:"erro",texto:e.message}; telaEntrada(); }
}

async function sair(){ await api("/sair",{method:"POST"}); comecar(); }

/* ---------------- lista de empresas ---------------- */
function telaEmpresas(){
  const linhas = empresas.map(e => `
    <tr>
      <td>
        <b>${esc(e.nome)}</b>
        <div class="meta">${esc(e.responsavel||"")}${e.email?" · "+esc(e.email):""}</div>
      </td>
      <td><span class="codigo">${esc(e.codigo)}</span>
        <div class="meta"><a onclick="copiar('${esc(e.codigo)}')" style="cursor:pointer">copiar</a> ·
          <a onclick="novoCodigo('${e.id}')" style="cursor:pointer">trocar</a></div></td>
      <td class="meta num">${e.resumo.usuarios} pessoas<br>${e.resumo.imoveis} imóveis<br>${e.resumo.leads} leads</td>
      <td>
        <div class="meta">${e.valor ? "R$ "+(e.valor/100).toLocaleString("pt-BR",{minimumFractionDigits:2}) : "sem valor"}</div>
        <div class="meta">${e.vencimento ? "vence "+e.vencimento.split("-").reverse().join("/") : "sem vencimento"}</div>
        <span class="pill ${cobrancaCor(e.cobranca)}"><i></i>${esc(textoCobranca(e.cobranca))}</span>
      </td>
      <td><span class="pill ${e.ativo?'quente':'frio'}"><i></i>${e.ativo?"ativa":"desativada"}</span></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn sm" onclick="pagou('${e.id}')">Recebi</button>
        <button class="btn sm" onclick="editarCobranca('${e.id}')">Cobrança</button>
        <button class="btn sm" onclick="mudar('${e.id}',{ativo:${e.ativo?false:true}})">${e.ativo?"Desativar":"Reativar"}</button>
        <button class="btn sm ghost" onclick="remover('${e.id}','${esc(e.nome)}')">Excluir</button>
      </td>
    </tr>`).join("");

  const linhasBackup = backups.map(b => `
    <tr>
      <td><b>${esc(diaBonito(b.dia))}</b><div class="meta">${esc(b.dia)}</div></td>
      <td class="meta">${b.bancos}<div class="meta">${esc((b.empresas||[]).map(e=>e.nome).join(", "))}</div></td>
      <td class="meta num">${tamanho(b.bytes)}</td>
      <td style="text-align:right"><button class="btn sm ghost" onclick="restaurar('${esc(b.dia)}')">Restaurar</button></td>
    </tr>`).join("");

  document.getElementById("raiz").innerHTML = `
  <main class="tela"><div class="dentro">
    <div class="topo">
      <div class="marca"><b>ROYAL</b><span>Painel do dono · ${esc(estado.dono?.nome||"")}</span></div>
      <button class="btn sm ghost" onclick="sair()">Sair</button>
    </div>

    ${mostrarAviso()}

    <div class="card">
      <h3 style="margin-top:0">Cadastrar empresa</h3>
      <p class="muted" style="margin-top:0">O código é sorteado na hora. É ele que a empresa digita para entrar — junto com o e-mail e a senha de cada pessoa.</p>
      <div class="grid4">
        <div class="campo"><label for="c-nome">Nome da imobiliária</label><input id="c-nome" placeholder="Ex: Silva Imóveis"></div>
        <div class="campo"><label for="c-resp">Responsável</label><input id="c-resp" placeholder="Nome de quem contratou"></div>
        <div class="campo"><label for="c-email">E-mail</label><input id="c-email" type="email" placeholder="contato@empresa.com"></div>
        <div class="campo"><label for="c-tel">Telefone</label><input id="c-tel" placeholder="(34) 9 ..."></div>
      </div>
      <button class="btn primary" onclick="cadastrar()">Cadastrar e gerar código</button>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>Empresas (${empresas.length})</h3>
      <table class="tab">
        <thead><tr><th>Empresa</th><th>Código</th><th>Uso</th><th>Mensalidade</th><th>Conta</th><th></th></tr></thead>
        <tbody>${linhas || '<tr><td colspan="6" class="muted">Nenhuma empresa ainda.</td></tr>'}</tbody>
      </table>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>Backup diário</h3>
      <p class="muted" style="margin-top:0">
        Todo dia o sistema tira uma cópia do banco de cada empresa e guarda de lado, por 30 dias.
        A nuvem espelha o que acontece agora; o backup lembra como estava ontem. Restaurar repõe o dia
        escolhido — e antes disso guarda o estado atual, caso você se arrependa.
      </p>
      <button class="btn" onclick="backupAgora()">Fazer backup agora</button>
      <table class="tab" style="margin-top:12px">
        <thead><tr><th>Dia</th><th>Bancos</th><th>Tamanho</th><th></th></tr></thead>
        <tbody>${linhasBackup || '<tr><td colspan="4" class="muted">Nenhum backup ainda.</td></tr>'}</tbody>
      </table>
    </div>

    <p class="muted" style="margin-top:18px;font-size:13px">
      Cada empresa tem banco de dados próprio: carteira, leads, conversas, usuários, equipes e chatbot separados.
      Ninguém enxerga a base de ninguém. Quem entra com um código cai direto no sistema daquela empresa, e o
      perfil da pessoa (corretor, gerente ou administrador) decide sozinho o que ela pode ver.
    </p>
  </div></main>`;
}

function textoCobranca(c){
  if(!c || c.estado==="sem cobrança") return "sem mensalidade";
  if(c.estado==="em dia") return "em dia";
  if(c.estado==="vence em breve") return `vence em ${c.diasParaVencer} dia(s)`;
  if(c.estado==="atrasada") return `atrasada ${c.diasDeAtraso}d — tranca em ${c.diasParaBloquear}`;
  return `bloqueada há ${c.diasDeAtraso - (c.tolerancia||0)} dia(s)`;
}
const cobrancaCor = (c) => !c || c.estado==="sem cobrança" ? "" :
  c.bloqueada ? "frio" : (c.estado==="em dia" ? "quente" : "morno");

async function pagou(id){
  const meses = prompt("Recebi quantos meses?", "1");
  if(meses === null) return;
  try{ const e = await api("/empresas/"+id+"/pagamento",{method:"POST",body:JSON.stringify({meses:Number(meses)||1})});
       aviso={tipo:"ok",texto:`Pagamento registrado. ${e.nome} vence de novo em ${e.vencimento.split("-").reverse().join("/")}.`};
       await carregar(); }
  catch(err){ alert(err.message); }
}

async function editarCobranca(id){
  const e = empresas.find(x=>x.id===id);
  const valor = prompt("Valor da mensalidade em reais (ex: 297):", e.valor ? String(e.valor/100) : "");
  if(valor === null) return;
  const venc = prompt("Próximo vencimento (AAAA-MM-DD):", e.vencimento || "");
  if(venc === null) return;
  const tol = prompt("Dias de tolerância antes de trancar:", String(e.tolerancia ?? 5));
  if(tol === null) return;
  try{
    await api("/empresas/"+id+"/cobranca",{method:"PUT",body:JSON.stringify({
      valor: Math.round(Number(String(valor).replace(",","."))*100)||0,
      vencimento: venc.trim(), tolerancia: Number(tol)||5})});
    await carregar();
  }catch(err){ alert(err.message); }
}

async function cadastrar(){
  const nome = val("c-nome").trim();
  if(!nome) return alert("Informe o nome da empresa.");
  try{
    const e = await api("/empresas",{method:"POST",body:JSON.stringify({
      nome, responsavel: val("c-resp"), email: val("c-email"), telefone: val("c-tel")})});
    aviso = {tipo:"ok", texto:`${e.nome} cadastrada. O código é ${e.codigo} — passe para eles junto com o endereço do sistema.`};
    await carregar();
  }catch(err){ alert(err.message); }
}

async function mudar(id, dados){
  try{ await api("/empresas/"+id,{method:"PUT",body:JSON.stringify(dados)}); await carregar(); }
  catch(e){ alert(e.message); }
}

async function novoCodigo(id){
  if(!confirm("Gerar um código novo? O anterior deixa de funcionar na hora.")) return;
  try{ const e = await api("/empresas/"+id+"/codigo",{method:"POST"});
       aviso={tipo:"ok",texto:`Código novo de ${e.nome}: ${e.codigo}`}; await carregar(); }
  catch(err){ alert(err.message); }
}

async function remover(id, nome){
  if(!confirm(`Tirar "${nome}" da lista? Os dados dela continuam guardados no servidor, mas ninguém consegue mais entrar.`)) return;
  try{ await api("/empresas/"+id,{method:"DELETE"}); await carregar(); }
  catch(e){ alert(e.message); }
}

const tamanho = b => b > 1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1, Math.round(b/1024))+" KB";

function diaBonito(dia){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dia)) return dia.replace("antes-de-restaurar-","antes de restaurar · ");
  const hoje = new Date().toISOString().slice(0,10);
  const ontem = new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(dia===hoje) return "hoje";
  if(dia===ontem) return "ontem";
  return dia.split("-").reverse().join("/");
}

async function backupAgora(){
  try{
    const r = await api("/backups/agora",{method:"POST"});
    aviso = {tipo:"ok", texto:`Backup feito: ${r.arquivos.length} banco(s), ${tamanho(r.total)}.`};
    await carregar();
  }catch(e){ alert(e.message); }
}

async function restaurar(dia){
  if(!confirm(`Voltar TODOS os bancos para como estavam em ${diaBonito(dia)}?\n\nTudo que foi feito depois disso some. O estado de agora é guardado antes, então dá para voltar atrás.`)) return;
  if(!confirm("Tem certeza mesmo? Depois de restaurar, reinicie o servidor.")) return;
  try{
    const r = await api("/backups/"+encodeURIComponent(dia)+"/restaurar",{method:"POST",body:JSON.stringify({alvo:"tudo"})});
    aviso = {tipo:"ok", texto:`Restaurado o dia ${diaBonito(dia)} (${r.restaurados.length} arquivo(s)). Reinicie o servidor agora.`};
    await carregar();
  }catch(e){ alert(e.message); }
}

function copiar(t){ navigator.clipboard?.writeText(t); aviso={tipo:"ok",texto:"Código "+t+" copiado."}; telaEmpresas(); }

async function carregar(){
  empresas = await api("/empresas");
  try{ backups = await api("/backups"); }catch{ backups = []; }
  telaEmpresas();
}

async function comecar(){
  aviso = null;
  estado = await api("/estado");
  if(!estado.dono) return telaEntrada();
  await carregar();
}

comecar();
</script>
</body>
</html>
