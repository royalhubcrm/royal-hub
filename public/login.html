<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Royal Hub</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0C0B09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Royal Hub">
<link rel="apple-touch-icon" href="/icones/apple-180.png">
<link rel="icon" href="/icones/icone-192.png">
<link rel="stylesheet" href="/styles.css">
<style>
.tela{min-height:100vh;display:grid;place-items:center;padding:24px}
.caixa{width:100%;max-width:400px}
.marca{text-align:center;margin-bottom:30px}
.marca b{font-family:var(--f-disp);font-size:26px;letter-spacing:.18em;color:var(--gold-soft);display:block;font-weight:400}
.marca span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted2)}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
.campo input{width:100%}
.aviso{padding:11px 13px;border-radius:var(--r);font-size:13px;margin-bottom:14px;line-height:1.5}
.aviso.erro{background:rgba(190,70,60,.12);border:1px solid rgba(190,70,60,.4);color:#E8A79F}
.aviso.ok{background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.35);color:var(--gold-soft)}
.links{margin-top:18px;display:flex;justify-content:space-between;gap:12px;font-size:13px;flex-wrap:wrap}
.links a{color:var(--muted);cursor:pointer;text-decoration:none;border-bottom:1px solid var(--line)}
.links a:hover{color:var(--gold-soft)}
.btn.w{width:100%;justify-content:center;padding:12px}
</style>
</head>
<body>
<main class="tela"><div class="caixa">
  <div class="marca"><b>ROYAL</b><span>Hub do corretor</span></div>
  <div class="card" id="cartao"><p class="muted">Carregando…</p></div>
</div></main>

<script>
const el = document.getElementById("cartao");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let estado = {};
let aviso = null;

async function api(rota, corpo, metodo="POST"){
  const r = await fetch("/api/auth/"+rota, {
    method: metodo, headers:{"content-type":"application/json"},
    body: corpo ? JSON.stringify(corpo) : undefined });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.erro || "Não deu certo. Tente de novo.");
  return j;
}

const campo = (id, rotulo, tipo="text", extra="") =>
  `<div class="campo"><label for="${id}">${rotulo}</label>
   <input id="${id}" type="${tipo}" ${extra}></div>`;

function mostrarAviso(){
  if(!aviso) return "";
  return `<div class="aviso ${aviso.tipo}">${esc(aviso.texto)}</div>`;
}

function telaEntrar(){
  el.innerHTML = `${mostrarAviso()}
    ${campo("email","E-mail","email",'autocomplete="username" autofocus')}
    ${campo("senha","Senha","password",'autocomplete="current-password"')}
    <button class="btn primary w" onclick="entrar()">Entrar</button>
    <div class="links"><a onclick="telaEsqueci()">Esqueci minha senha</a></div>`;
  ligarEnter(entrar);
}

function telaPrimeiro(){
  el.innerHTML = `<h3 style="margin-top:0">Primeiro acesso</h3>
    <p class="muted" style="margin-top:0">Crie a conta de administrador. É ela que cadastra as outras pessoas.</p>
    ${mostrarAviso()}
    ${campo("nome","Seu nome","text",'autofocus')}
    ${campo("email","E-mail","email")}
    ${campo("senha","Senha (mínimo 6 caracteres)","password")}
    <button class="btn primary w" onclick="criarAdmin()">Criar conta e entrar</button>`;
  ligarEnter(criarAdmin);
}

function telaEsqueci(){
  aviso = null;
  el.innerHTML = `<h3 style="margin-top:0">Recuperar senha</h3>
    <p class="muted" style="margin-top:0">Informe o e-mail cadastrado. Enviamos um código de 6 dígitos.</p>
    ${mostrarAviso()}
    ${campo("email","E-mail","email",'autofocus')}
    <button class="btn primary w" onclick="pedirCodigo()">Enviar código</button>
    <div class="links"><a onclick="telaEntrar()">Voltar</a><a onclick="telaCodigo()">Já tenho um código</a></div>`;
  ligarEnter(pedirCodigo);
}

function telaCodigo(email){
  el.innerHTML = `<h3 style="margin-top:0">Nova senha</h3>
    ${mostrarAviso()}
    ${campo("email","E-mail","email", email?`value="${esc(email)}"`:"")}
    ${campo("codigo","Código de 6 dígitos","text",'inputmode="numeric" maxlength="6" autofocus')}
    ${campo("senha","Nova senha","password")}
    <button class="btn primary w" onclick="redefinir()">Salvar nova senha</button>
    <div class="links"><a onclick="telaEntrar()">Voltar para o login</a></div>`;
  ligarEnter(redefinir);
}

function ligarEnter(fn){
  el.querySelectorAll("input").forEach(i =>
    i.addEventListener("keydown", e => { if(e.key==="Enter") fn(); }));
}
const v = id => (document.getElementById(id)||{}).value || "";

async function entrar(){
  try{ await api("entrar",{email:v("email"), senha:v("senha")}); location.href = "/"; }
  catch(e){ aviso={tipo:"erro",texto:e.message}; telaEntrar(); }
}

async function criarAdmin(){
  try{ await api("primeiro-acesso",{nome:v("nome"), email:v("email"), senha:v("senha")}); location.href = "/"; }
  catch(e){ aviso={tipo:"erro",texto:e.message}; telaPrimeiro(); }
}

async function pedirCodigo(){
  const email = v("email");
  try{
    const r = await api("esqueci",{email});
    aviso = { tipo:"ok", texto: r.porEmail
      ? "Se existir conta com esse e-mail, o código chegou lá. Vale por 20 minutos."
      : "O envio por e-mail ainda não foi configurado — o código apareceu no terminal do sistema." };
    telaCodigo(email);
  }catch(e){ aviso={tipo:"erro",texto:e.message}; telaEsqueci(); }
}

async function redefinir(){
  try{
    await api("redefinir",{email:v("email"), codigo:v("codigo"), senha:v("senha")});
    aviso = { tipo:"ok", texto:"Senha trocada. Entre com ela agora." };
    telaEntrar();
  }catch(e){ const em=v("email"); aviso={tipo:"erro",texto:e.message}; telaCodigo(em); }
}

fetch("/api/auth/estado").then(r=>r.json()).then(e=>{
  estado = e;
  if(e.usuario) return location.href = "/";
  e.primeiroAcesso ? telaPrimeiro() : telaEntrar();
});
</script>
<script>
  // liga o modo aplicativo (funciona só em endereço https ou no localhost)
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
