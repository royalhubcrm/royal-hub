# Publicação no Render (render.com)
services:
  - type: web
    name: royal-hub
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /login
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: URL_PUBLICA
        sync: false
      - key: SUPABASE_URL
        sync: false          # ex: https://xxxxxxxx.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false          # chave service_role do projeto (secreta)

# Sobre o armazenamento:
# Com SUPABASE_URL e SUPABASE_SERVICE_KEY preenchidas, os dados moram no
# Supabase e o plano gratuito serve: reiniciar não apaga mais nada, porque
# o sistema baixa tudo de novo da nuvem ao ligar.
#
# Sem o Supabase, o plano gratuito guarda o banco na memória e ele some a
# cada reinício. Nesse caso, para uso real, mude "plan: free" para
# "plan: starter" e descomente o bloco abaixo.
#
#    disk:
#      name: dados
#      mountPath: /app/data
#      sizeGB: 1
