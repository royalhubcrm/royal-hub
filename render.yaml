# Publicação no Render (render.com)
services:
  - type: web
    name: royal-hub
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /login
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: URL_PUBLICA
        sync: false

# Sobre o armazenamento:
# O plano gratuito não permite disco fixo, então o banco fica na memória do
# servidor e some quando ele reinicia. Serve para testar e demonstrar.
# Para uso real, mude "plan: free" para "plan: starter" e descomente o bloco
# abaixo — aí o banco e as fotos passam a sobreviver aos reinícios.
#
#    disk:
#      name: dados
#      mountPath: /app/data
#      sizeGB: 1
